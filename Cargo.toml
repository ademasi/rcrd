[package]
name = "rcrd"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["std", "local-offset"] }
dirs = "5"
nix = { version = "0.29", features = ["fs", "signal", "term", "poll"] }
libc = "0.2"
